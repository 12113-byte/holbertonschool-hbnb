<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Place Details</title>
    <link rel="stylesheet" href="../static/styles.css">
    <script src="scripts.js"></script>
</head>
<body>
    <!-- header -->
     <header>
        <nav>
            <a href="index.html">
                <img src="../static/images/logo.png" alt="HBnB" class="logo">
            </a>
            
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="place.html">All Places</a></li>
                <li><a href="login.html">Login</a></li>
                <input type="text" placeholder="Search places..." class="search-bar">
            </ul>
        
        </nav>
     </header>
    <main>
        <a href="index.html" class="back-button">← See all places</a>
        <section id="place-details">
            <!-- Place details will be populated dynamically -->
             <h2 class="title">Beautiful Apartment</h2>
        
             <img src="../static/images/place-image-01.jpg" alt=""Place Image" class="place-image">
        <div class="place-info">
            <div class="place-left">
                <p class="description">A lovely place in the city</p>
                <p class="owner">Owner: John Doe</p>
            </div>
            <div class="place-right">
                <p class="price">$100 per night</p>
                <button class="button">Book Now</button>
            </div>
        </div>
        <hr>
        <h3 class="amenities-title">Amenities</h3>
        <ul class="amenities-list">
            <li class="amenity-item">WiFi</li>
            <li class="amenity-item">Pool</li>
        </ul>

        </section>
        <section id="reviews">
            <!-- Reviews will be populated dynamically -->

        <h3 class="review-title">Reviews</h3>
        <div class="review">
            <p>Rating: 5 - Great place!</p>
        </div>

        <section id="add-review">
            <button onclickf="window.location.href='./app/templates/add_review.html'">Add Review</button>
            </section>
        </section>
    </main>
    <script src="scripts.js"></script>
</body>
</html>
